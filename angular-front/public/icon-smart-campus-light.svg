<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Smart Campus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#0E6BA8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A5F3FC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A5F3FC" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect width="200" height="200" rx="44"/>
    </clipPath>
    <style>
      .sheen {
        animation: sweep 5s ease-in-out 1s infinite;
      }

      .glow {
        animation: glow 4.2s ease-in-out infinite;
      }

      .dot,
      .wave {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: ping 2.8s ease-in-out infinite;
      }

      .dot { transform-origin: 50% 50%; }
      .wave--1 { animation-delay: 0.12s; }
      .wave--2 { animation-delay: 0.36s; }

      .roof {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: roof-in 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .beam,
      .base {
        animation: fade-in 600ms ease-out 200ms both;
      }

      .column {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: rise 900ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .column--1 { animation-delay: 250ms; }
      .column--2 { animation-delay: 330ms; }
      .column--3 { animation-delay: 410ms; }
      .column--4 { animation-delay: 490ms; }

      @keyframes sweep {
        0%,
        55% {
          transform: translateX(0) skewX(-18deg);
        }
        100% {
          transform: translateX(360px) skewX(-18deg);
        }
      }

      @keyframes glow {
        0%,
        100% {
          opacity: 0.12;
        }
        50% {
          opacity: 0.3;
        }
      }

      @keyframes ping {
        0%,
        100% {
          transform: scale(0.94);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.06);
          opacity: 1;
        }
      }

      @keyframes roof-in {
        from {
          transform: translateY(-14px) scaleX(0.9);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes rise {
        from {
          transform: scaleY(0.15);
          opacity: 0;
        }
        to {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sheen,
        .glow,
        .dot,
        .wave,
        .roof,
        .beam,
        .base,
        .column {
          animation: none;
        }

        .column,
        .roof {
          transform: none;
          opacity: 1;
        }
      }
    </style>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="200" height="200" rx="44" fill="url(#bg)"/>
    <circle class="glow" cx="144" cy="34" r="76" fill="url(#glow)"/>
    <rect class="sheen" x="-120" y="-20" width="120" height="240" fill="url(#sheen)"/>
  </g>

  <g class="signal">
    <circle class="dot" cx="100" cy="42" r="6" fill="#A5F3FC"/>
    <path class="wave wave--1" d="M84 34 Q100 18 116 34" stroke="#A5F3FC" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path class="wave wave--2" d="M70 26 Q100 -4 130 26" stroke="#A5F3FC" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <g class="building">
    <polygon class="roof" points="100,54 38,94 162,94" fill="#FFFFFF"/>
    <rect class="beam" x="42" y="100" width="116" height="9" rx="3" fill="#FFFFFF"/>
    <rect class="column column--1" x="51" y="115" width="14" height="38" rx="2" fill="#FFFFFF"/>
    <rect class="column column--2" x="79" y="115" width="14" height="38" rx="2" fill="#FFFFFF"/>
    <rect class="column column--3" x="107" y="115" width="14" height="38" rx="2" fill="#FFFFFF"/>
    <rect class="column column--4" x="135" y="115" width="14" height="38" rx="2" fill="#FFFFFF"/>
    <rect class="base" x="42" y="158" width="116" height="9" rx="3" fill="#FFFFFF"/>
  </g>
</svg>
