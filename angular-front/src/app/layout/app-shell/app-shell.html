<div class="shell" [class.shell--sidebar-collapsed]="sidebarCollapsed()">
  <div
    class="shell__mobile-overlay"
    [class.shell__mobile-overlay--visible]="mobileMenuOpen()"
    aria-hidden="true"
    (click)="closeMobileMenu()"
  ></div>

  <div class="shell__sidebar" [class.shell__sidebar--open]="mobileMenuOpen()">
    <app-sidebar (closeRequested)="closeMobileMenu()" />
  </div>

  <div class="shell__body">
    <app-topbar
      [sidebarCollapsed]="sidebarCollapsed()"
      (menuRequested)="openMobileMenu()"
      (collapseRequested)="toggleSidebar()"
    />
    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
