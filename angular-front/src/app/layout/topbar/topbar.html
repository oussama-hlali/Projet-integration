<header class="top">
  <a
    class="brand glass glass--chrome"
    [routerLink]="auth.homeRoute()"
    [attr.aria-label]="auth.isAdmin() ? 'Smart Campus admin home' : 'Smart Campus home'"
  >
    <img class="brand__logo brand__logo--light" src="/icon-smart-campus-light.svg" alt="">
    <img class="brand__logo brand__logo--dark" src="/icon-smart-campus-dark.svg" alt="">
    <span class="brand__name">Smart Campus</span>
  </a>

  <app-tab-nav class="top__tabs" />

  <div class="top__tools glass glass--chrome">
    <span class="top__user">
      {{ auth.currentUser()?.fullName }}
      <span class="top__role" [class.top__role--admin]="auth.isAdmin()">{{ roleLabel }}</span>
    </span>
    <a
      class="top__me"
      routerLink="/profile"
      [attr.aria-label]="'Signed in as ' + roleLabel + ' — open profile'"
      [attr.title]="roleLabel"
    >
      <span class="top__avatar" aria-hidden="true">{{ auth.isAdmin() ? 'A' : 'S' }}</span>
    </a>
    <button type="button" class="top__logout" (click)="logout()" aria-label="Sign out" title="Sign out">
      ⎋
    </button>
  </div>
</header>
