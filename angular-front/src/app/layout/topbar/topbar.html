<header class="top">
  <a
    class="brand glass glass--chrome"
    [routerLink]="auth.homeRoute()"
    [attr.aria-label]="auth.isAdmin() ? 'Smart Campus admin home' : 'Smart Campus home'"
  >
    <img class="brand__logo brand__logo--light" src="/icon-smart-campus-light.svg" alt="">
    <img class="brand__logo brand__logo--dark" src="/icon-smart-campus-dark.svg" alt="">
    <span class="brand__name">Smart Campus</span>
  </a>

  <app-tab-nav class="top__tabs" />

  <div class="top__tools glass glass--chrome">
    <a
      class="top__icon"
      routerLink="/assistant"
      routerLinkActive="top__icon--active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Open AI assistant"
      title="AI assistant"
    >
      <app-nav-icon name="assistant" />
    </a>
    @if (auth.isAdmin()) {
      <a
        class="top__icon"
        routerLink="/admin/ai-analytics"
        routerLinkActive="top__icon--active"
        [routerLinkActiveOptions]="{ exact: true }"
        aria-label="Open AI analytics"
        title="AI analytics"
      >
        <app-nav-icon name="analytics" />
      </a>
    }
    <a
      class="top__icon"
      routerLink="/notifications"
      routerLinkActive="top__icon--active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Open notifications"
      title="Notifications"
    >
      <app-nav-icon name="bell" />
      @if (notifications.unreadCount() > 0) {
        <span class="top__badge">{{ notifications.unreadCount() }}</span>
      }
    </a>
    <span class="top__user">
      {{ auth.currentUser()?.fullName }}
      <span class="top__role" [class.top__role--admin]="auth.isAdmin()">{{ roleLabel }}</span>
    </span>
    <a
      class="top__me"
      routerLink="/profile"
      [attr.aria-label]="'Signed in as ' + roleLabel + ' — open profile'"
      [attr.title]="roleLabel"
    >
      <img class="top__avatar top__avatar--light" src="/icon-smart-campus-light.svg" alt="">
      <img class="top__avatar top__avatar--dark" src="/icon-smart-campus-dark.svg" alt="">
    </a>
    <button type="button" class="top__logout" (click)="logout()" aria-label="Sign out" title="Sign out">
      ⎋
    </button>
  </div>
</header>
