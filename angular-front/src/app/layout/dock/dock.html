<nav class="dock glass glass--thick" aria-label="Shortcuts">
  <a
    class="dock__btn dock__brand"
    [routerLink]="homeRoute()"
    routerLinkActive="dock__btn--active"
    [routerLinkActiveOptions]="{ exact: true }"
    #home="routerLinkActive"
    aria-label="Smart Campus home"
    [attr.aria-current]="home.isActive ? 'page' : null"
    data-label="Home"
  >
    <app-brand-mark size="sm" />
  </a>

  <span class="dock__divider" aria-hidden="true"></span>

  @for (item of visibleAccount(); track item.route) {
    <a
      class="dock__btn"
      [routerLink]="item.route"
      routerLinkActive="dock__btn--active"
      [routerLinkActiveOptions]="{ exact: true }"
      #dockLink="routerLinkActive"
      [attr.aria-current]="dockLink.isActive ? 'page' : null"
      [attr.aria-label]="
        item.route === reviewRoute
          ? item.label + ' (' + pendingReviews() + ' pending)'
          : item.label
      "
      [attr.data-label]="item.label"
    >
      <app-nav-icon [name]="item.icon" />
      @if (item.route === reviewRoute && pendingReviews() > 0) {
        <span class="dock__badge" aria-hidden="true">{{ pendingReviews() }}</span>
      }
    </a>
  }

  <span class="dock__divider" aria-hidden="true"></span>

  <app-theme-toggle class="dock__theme" />

  <button
    class="dock__btn dock__btn--quit"
    type="button"
    aria-label="Log out"
    data-label="Log out"
    (click)="logout()"
  >
    <app-nav-icon name="logout" />
  </button>
</nav>
