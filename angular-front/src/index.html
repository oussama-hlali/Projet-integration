<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Smart Campus</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Smart Campus 2026 — unified campus services web client.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    /* Apply the saved theme before first paint so the page never flashes. */
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('smart-campus.theme');
        if (stored === 'light' || stored === 'dark') {
          theme = stored;
        }
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=JetBrains+Mono:wght@700&family=Urbanist:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
