services:
  - type: web
    name: smart-campus-gateway
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

  - type: web
    name: smart-campus-identity
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: identity/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

  - type: web
    name: smart-campus-campus
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: campus/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

  - type: web
    name: smart-campus-engagement
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: engagement/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

  - type: web
    name: smart-campus-cafeteria-kpng
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: cafeteria/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

  - type: web
    name: smart-campus-notifications
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: notifications/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

  - type: web
    name: smart-campus-ai-zngn
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: ai/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

envVarGroups:
  - name: smart-campus
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: IDENTITY_URL
        sync: false
      - key: CAMPUS_URL
        sync: false
      - key: ENGAGEMENT_URL
        sync: false
      - key: CAFETERIA_URL
        sync: false
      - key: NOTIFICATIONS_URL
        sync: false
      - key: GATEWAY_URL
        sync: false
      - key: AI_URL
        sync: false
      - key: AI_GATEWAY_TIMEOUT_MS
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_API_KEY
        sync: false
      - key: IDENTITY_JWKS_URL
        sync: false
      - key: REFRESH_COOKIE_SAME_SITE
        value: None
      - key: REFRESH_COOKIE_SECURE
        value: "true"
