services:
  - type: web
    name: smart-campus-gateway
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

  - type: web
    name: smart-campus-identity
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: identity/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

  - type: web
    name: smart-campus-campus
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: campus/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

  - type: web
    name: smart-campus-engagement
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: engagement/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

  - type: web
    name: smart-campus-cafeteria
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: cafeteria/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

  - type: web
    name: smart-campus-notifications
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: notifications/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

  - type: web
    name: smart-campus-ai
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: ai/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: smart-campus

envVarGroups:
  - name: smart-campus
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: IDENTITY_URL
        sync: false
      - key: CAMPUS_URL
        sync: false
      - key: ENGAGEMENT_URL
        sync: false
      - key: CAFETERIA_URL
        sync: false
      - key: NOTIFICATIONS_URL
        sync: false
      - key: GATEWAY_URL
        sync: false
      - key: AI_URL
        sync: false
      - key: AI_GATEWAY_TIMEOUT_MS
        sync: false
      - key: IDENTITY_JWKS_URL
        sync: false
