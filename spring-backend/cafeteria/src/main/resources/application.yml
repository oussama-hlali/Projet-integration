spring:
  application:
    name: cafeteria
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartcampus}
    username: ${DB_USER:cafeteria_user}
    password: ${DB_PASSWORD:cafeteria_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cafeteria
  flyway:
    enabled: true
    schemas: cafeteria
    default-schema: cafeteria
    locations: classpath:db/migration

server:
  port: ${PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URL:http://localhost:8081/.well-known/jwks.json}
