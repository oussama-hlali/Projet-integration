spring:
  datasource:
    url: jdbc:h2:mem:engagement;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS ENGAGEMENT
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: engagement
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
