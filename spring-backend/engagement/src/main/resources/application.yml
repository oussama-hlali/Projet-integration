spring:
  application:
    name: engagement
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartcampus}
    username: ${DB_USER:engagement_user}
    password: ${DB_PASSWORD:engagement_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: engagement
  flyway:
    enabled: true
    schemas: engagement
    default-schema: engagement
    locations: classpath:db/migration

server:
  port: ${PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
