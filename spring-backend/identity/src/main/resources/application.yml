spring:
  application:
    name: identity
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartcampus}
    username: ${DB_USER:identity_user}
    password: ${DB_PASSWORD:identity_pass}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity
  flyway:
    enabled: true
    schemas: identity
    default-schema: identity
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URL:http://localhost:8081/.well-known/jwks.json}

auth:
  refresh-cookie:
    name: sc_refresh
    same-site: ${REFRESH_COOKIE_SAME_SITE:None}
    secure: ${REFRESH_COOKIE_SECURE:true}
    max-age-seconds: 2592000

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
