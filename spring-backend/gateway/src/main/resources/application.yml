spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:4200"
              - "https://smart-campus-2026.vercel.app"
            allowed-origin-patterns:
              - "https://*.vercel.app"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
      routes:
        # KPI endpoints first — they must win over the generic /api/v1/<domain>/** routes.
        - id: identity-kpi
          uri: ${IDENTITY_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/identity/kpi
        - id: campus-kpi
          uri: ${CAMPUS_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/campus/kpi
        - id: engagement-kpi
          uri: ${ENGAGEMENT_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/engagement/kpi
        - id: cafeteria-kpi
          uri: ${CAFETERIA_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/cafeteria/kpi
        - id: notifications-kpi
          uri: ${NOTIFICATIONS_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications/kpi
        - id: identity
          uri: ${IDENTITY_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: campus
          uri: ${CAMPUS_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/announcements/**,/api/v1/rooms/**,/api/v1/buildings/**,/api/v1/reservations/**,/api/v1/transport/**
        - id: engagement
          uri: ${ENGAGEMENT_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/events/**,/api/v1/lost-found/**,/api/v1/me/**
        - id: cafeteria
          uri: ${CAFETERIA_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/menus/**,/api/v1/orders/**
        - id: notifications
          uri: ${NOTIFICATIONS_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications/**
        - id: ai
          uri: ${AI_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/ai/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URL:http://localhost:8081/.well-known/jwks.json}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
