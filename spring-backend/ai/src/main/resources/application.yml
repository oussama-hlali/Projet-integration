spring:
  application:
    name: ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartcampus}
    username: ${DB_USER:ai_user}
    password: ${DB_PASSWORD:ai_pass}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai
  flyway:
    enabled: true
    schemas: ai
    default-schema: ai
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URL:http://localhost:8081/.well-known/jwks.json}

server:
  port: ${PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
