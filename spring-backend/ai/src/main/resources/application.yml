spring:
  application:
    name: ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartcampus}
    username: ${DB_USER:ai_user}
    password: ${DB_PASSWORD:ai_pass}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai
  flyway:
    enabled: true
    schemas: ai
    default-schema: ai
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URL:http://localhost:8081/.well-known/jwks.json}

ai:
  gateway:
    base-url: ${GATEWAY_URL:http://localhost:8080}
    timeout-ms: ${AI_GATEWAY_TIMEOUT_MS:4000}
  provider:
    type: ${AI_PROVIDER:stub}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    timeout-ms: ${AI_TIMEOUT_MS:30000}

server:
  port: ${PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
