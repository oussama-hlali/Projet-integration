name: Keep Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping services
        run: |
          for url in \
            "https://smart-campus-identity.onrender.com/actuator/health" \
            "https://smart-campus-gateway.onrender.com/actuator/health"; do
            curl -s -o /dev/null -w "%{http_code}" "$url" || true
            echo " $url"
          done
