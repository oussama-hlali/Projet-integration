name: Backend CI

on:
  push:
    branches: [main, 'feat/**']
    paths: ['spring-backend/**', 'supabase/**', 'render.yaml']
  pull_request:
    paths: ['spring-backend/**', 'supabase/**', 'render.yaml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        working-directory: spring-backend
        run: mvn -q verify

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start identity (dev profile)
        working-directory: spring-backend
        run: |
          mvn -q -pl identity -am spring-boot:run -Dspring-boot.run.profiles=dev &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health && exit 0
            sleep 2
          done
          echo "identity did not become healthy" && exit 1
      - name: Check JWKS endpoint
        run: curl -sf http://localhost:8081/.well-known/jwks.json | grep -q '"keys"'
      - name: Check login stub
        run: |
          curl -sf -X POST http://localhost:8081/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ahmed.wardi@campus.tn","password":"student123"}' | grep -q 'accessToken'
