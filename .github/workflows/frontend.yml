name: Frontend CI

on:
  push:
    branches: [main, 'feat/**']
    paths: ['angular-front/**']
  pull_request:
    paths: ['angular-front/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: angular-front/package-lock.json
      - name: Install
        working-directory: angular-front
        run: npm ci
      - name: Test
        working-directory: angular-front
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build
        working-directory: angular-front
        run: npx ng build
